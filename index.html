<script>
(function(){
  var T={
    en:["📍 Villupuram, Tamil Nadu, India","No 437 Devanatha Swamy Nagar, East Pondy Road, VPM"],
    ta:["📍 விழுப்புரம், தமிழ்நாடு, இந்தியா","எண் 437, தேவநாத சுவாமி நகர், கிழக்கு பாண்டி சாலை, விழுப்புரம்"]
  };
  function put(){
    var s=document.querySelector("#contact .callsec");
    if(!s) return;
    var d=document.getElementById("addr-block");
    if(!d){
      d=document.createElement("div");
      d.id="addr-block";
      d.className="addr";
      s.parentNode.insertBefore(d,s.nextSibling);
    }
    var t=T[document.documentElement.lang==="ta"?"ta":"en"];
    var h="<p>"+t[0]+"</p><p>"+t[1]+"</p>";
    if(d.innerHTML!==h) d.innerHTML=h;
  }
  new MutationObserver(put).observe(document.getElementById("root"),{childList:true,subtree:true});
  new MutationObserver(put).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
  put();
})();
</script></style>

:root{--navy:#102878;--navy2:#0a1a52;--gold:#d1bb7c;--gold2:#b8973a;--band:#f6edcf;--bg:#fffdf7;--text:#232940;--muted:#665f48;--line:#eadfb9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 'Noto Sans','Noto Sans Tamil',system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,'Noto Serif Tamil',serif;color:var(--navy2);line-height:1.1;margin:0}
.top{background:var(--navy);color:#f6edcf;text-align:center;font-size:.85rem;padding:7px 12px}
.top a{font-variant-numeric:lining-nums;color:var(--gold);text-decoration:none;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#fffdf7;border-bottom:2px solid var(--gold)}
.bar{max-width:1080px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:700 1.3rem 'Cormorant Garamond',Georgia,serif;color:var(--navy);text-decoration:none;letter-spacing:.05em;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--text);text-decoration:none;padding:8px 14px;font-weight:600;font-size:.92rem;border-bottom:3px solid transparent}
nav a.on{color:var(--navy);border-bottom-color:var(--gold2)}
.lang{border:1.5px solid var(--navy);color:var(--navy);background:none;border-radius:6px;padding:6px 14px;font:600 .88rem 'Noto Sans','Noto Sans Tamil',sans-serif;cursor:pointer}
.lang:hover{background:var(--navy);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.page{display:none}.page.on{display:block}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
.hero{background:linear-gradient(135deg,#ecd999,var(--gold) 60%,#c7ad63);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-50%;background:radial-gradient(circle,transparent 0 7px,rgba(16,40,120,.13) 8px 9px,transparent 10px 17px,rgba(16,40,120,.1) 18px 19px,transparent 20px 28px,rgba(16,40,120,.07) 29px 30px,transparent 31px) 0 0/76px 76px;animation:pan 60s linear infinite}
@keyframes pan{to{transform:translate(76px,76px)}}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero h1{font-size:clamp(2.6rem,7vw,4.4rem);color:var(--navy2)}
.hero p{max-width:42ch;color:#2c2f45;font-size:1.05rem}
.logo{width:100%;border-radius:10px;display:block;border:3px solid var(--navy);box-shadow:8px 8px 0 var(--navy)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;background:var(--navy);color:#fff;padding:13px 26px;border-radius:6px;font:600 .98rem 'Noto Sans','Noto Sans Tamil',sans-serif;text-decoration:none;border:2px solid var(--navy);cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:transparent;color:var(--navy2)}
.btn.ghost:hover{background:rgba(16,40,120,.1)}
.btn.gold{background:var(--gold);color:var(--navy2);border-color:var(--gold)}
.sec{padding:56px 0}
.sec.band{background:var(--band)}
h2{font-size:clamp(1.9rem,4.5vw,2.8rem);margin-bottom:8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:58ch}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--navy);border-radius:10px;overflow:hidden;background:#fff}
.val{padding:26px;border-right:2px solid var(--navy)}
.val:last-child{border-right:0}
.val h3{font-size:1.5rem;margin-bottom:6px}
.val p{margin:0;color:var(--muted);font-size:.95rem}
.val b{display:block;font-size:1.8rem;margin-bottom:6px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.ph{flex:0 0 72px;height:72px;border:1.5px dashed var(--gold2);border-radius:8px;background:#fbf4dc;display:grid;place-items:center;font-size:.68rem;color:var(--muted)}
.info{flex:1;min-width:0}
.info h3{font-size:1.35rem}
.info span{color:var(--muted);font-size:.88rem}
.pr{font:700 1.3rem 'Noto Sans',system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums;color:var(--navy);text-align:right;line-height:1}
.pr small{display:block;font:400 .75rem 'Noto Sans','Noto Sans Tamil',sans-serif;color:var(--muted);margin-top:4px}
.fam{background:var(--navy);color:#f6edcf;border-radius:12px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:32px;border-top:6px solid var(--gold)}
.fam h2{color:#f6edcf}
.fam ul{list-style:none;margin:0;padding:0;columns:1}
.fam li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed rgba(246,237,207,.3);font-size:.94rem}
.fam li span:last-child{color:var(--gold)}
.tot{font:700 2.5rem 'Noto Sans',system-ui,sans-serif;font-variant-numeric:lining-nums;color:var(--gold);margin:6px 0 4px}
.pill{display:inline-block;background:var(--gold);color:var(--navy2);font-weight:600;border-radius:999px;padding:6px 16px;font-size:.9rem}
.ws{background:var(--navy);color:#f6edcf;border-radius:12px;padding:40px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.ws h2{color:#f6edcf}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:9px 0 9px 34px;position:relative;border-bottom:1px solid rgba(246,237,207,.2)}
.checks li::before{content:"✓";position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy2);font-weight:700;display:grid;place-items:center;font-size:.8rem}

.ogrid,.callrow{grid-template-columns:1fr}
.osum{position:static}
.opanel{padding:16px 14px}
.ordsec>.wrap{padding-top:32px;padding-bottom:96px}
.ordbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#f6edcf;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--gold);animation:rise .3s both}
.ordbar small{display:block;font-size:.76rem;opacity:.85}
.ordbar b{display:block;font:700 1.3rem 'Noto Sans',system-ui,sans-serif;color:var(--gold);font-variant-numeric:lining-nums tabular-nums;line-height:1.1}
.ordbar .btn.wa{width:auto;margin:0;padding:11px 18px;flex:none}
.ostrip{padding:18px 18px}
.ostrip .btn{width:100%;text-align:center}
.ordtop{width:100%;text-align:center}
.ch .btn.mini{width:auto}
}
